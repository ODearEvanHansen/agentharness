name: 作业 0 打卡
description: 完成作业 0 后在这里打卡（不要贴 API key）
title: "[A0 打卡] <你的昵称>"
labels: ["a0-checkin"]
body:
  - type: markdown
    attributes:
      value: |
        贴输出前请确认里面没有 API key（`sk-` 开头的字符串）。
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - x86_64 Linux
        - Windows + WSL2
        - 云主机（Linux）
    validations:
      required: true
  - type: textarea
    id: selfcheck
    attributes:
      label: selfcheck.py 的完整输出
      render: text
    validations:
      required: true
  - type: textarea
    id: level3
    attributes:
      label: 关卡 3 第 2、3 步的输出，以及 infra/README.md 白名单三条验证的输出
      render: text
