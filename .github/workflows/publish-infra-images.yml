name: Publish infra images to GHCR

# Builds and pushes the course runner and egress-proxy images (multi-arch):
#   ghcr.io/odearevanhansen/agentharness-runner:0.1
#   ghcr.io/odearevanhansen/agentharness-egress:0.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/runner/**"
      - "infra/egress/**"
      - ".github/workflows/publish-infra-images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-infra-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runner
            context: infra/runner
          - name: egress
            context: infra/egress
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/odearevanhansen/agentharness-${{ matrix.name }}:0.1
