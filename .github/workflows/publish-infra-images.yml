name: Publish infra images to GHCR

# Builds and pushes the course runner and egress-proxy images (multi-arch):
#   ghcr.io/odearevanhansen/agentharness-runner:0.1
#   ghcr.io/odearevanhansen/agentharness-egress:0.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/runner/**"
      - "infra/egress/**"
      - ".github/workflows/publish-infra-images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-infra-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runner
            context: infra/runner
          - name: egress
            context: infra/egress
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/odearevanhansen/agentharness-${{ matrix.name }}:0.1
