name: Deploy course site

on:
  push:
    branches: [main]
    paths: ["README.md", "docs/**", "assignment*/**", "infra/README.md", "videos/lectures/**", "videos/bilibili.json",
            "scripts/build_site.py", "mkdocs.base.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install mkdocs-material==9.*
      - run: python scripts/build_site.py && mkdocs build --strict -d _site
        env: {NO_MKDOCS_2_WARNING: "1"}
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
