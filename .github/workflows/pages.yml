name: Deploy course site

on:
  push:
    branches: [main]
    paths: ["README.md", "docs/**", "assignment*/**", "infra/README.md", "videos/lectures/**", "videos/bilibili.json", "leaderboard/**",
            "scripts/build_site.py", "mkdocs.base.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write   # 推送 gh-pages 分支

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install mkdocs-material==9.*
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/build_site.py
          mkdocs gh-deploy --force --strict
        env: {NO_MKDOCS_2_WARNING: "1"}
