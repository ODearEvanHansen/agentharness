name: Deploy course site
# 需要在仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。

on:
  push:
    branches: [main]
    paths: ["README.md", "docs/**", "assignment*/**", "infra/README.md", "videos/lectures/**", "videos/bilibili.json", "leaderboard/**",
            "scripts/build_site.py", "mkdocs.base.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install mkdocs-material==9.8.2 jieba==0.42.1  # jieba：中文搜索分词
      - run: |
          python scripts/build_site.py
          mkdocs build --strict -d _site
        env: {NO_MKDOCS_2_WARNING: "1"}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: {path: _site}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      # 冒烟检查：逐页确认 200
      - run: |
          base=https://odearevanhansen.github.io/agentharness
          for i in $(seq 1 20); do
            ok=1
            for p in "" syllabus/ project/ leaderboard/ assignments/a5/ lectures/l29/; do
              c=$(curl -s -o /dev/null -w "%{http_code}" "$base/$p"); [ "$c" = 200 ] || { ok=0; echo "$c $p"; }
            done
            [ $ok = 1 ] && { echo "all pages 200"; exit 0; }; sleep 15
          done
          exit 1
