# 作业 5 模板：主 agent 用 DeepSeek API，新增 local_worker 工具，把子 agent 路由到本地模型。
# 本地模型以容器 agentharness-llm 的形式跑在课程隔离网络里，agent 容器通过容器名访问它，见 assignment5/README.md。
# 运行前设置 LOCAL_LLM_KEY（与 llama-server --api-key 相同的随机值），profile 用 sdk（完整版，带子 agent）。
# 会话日志上传已由课程配置 infra/course.patch.yml 关闭（run.py 会自动加载）。
- id: llm-pi-ai
  config:
    providers:
      local:
        apiKeyEnv: LOCAL_LLM_KEY
        api: openai-completions
        baseURL: http://agentharness-llm:8091/v1
        models:
          - id: qwen3-coder-30b-a3b
- insert:
    - id: tool-subagent-local
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: local_worker
        agentOptions:
          provider: local
          model: qwen3-coder-30b-a3b
          maxTokens: 4096
